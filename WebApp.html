<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 0 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #faf7f0; color: #211f1b; font-size: 16px; line-height: 1.5;
    }
    main { padding: 14px; max-width: 760px; margin: 0 auto; }

    /* ヘッダー */
    header {
      background: #fffdf9; border-radius: 18px; padding: 16px 18px; margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(60,50,20,0.06);
      display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .eyebrow {
      font-size: 12px; letter-spacing: 0.12em; color: #8a7f65; font-weight: bold; margin-bottom: 4px;
    }
    header h1 { font-size: 23px; margin: 0 0 4px; }
    header .date { font-size: 14px; color: #6b6356; }
    .head-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .pill-ok {
      display: inline-block; background: #e4f5e8; color: #1f7a41; font-size: 12px;
      padding: 3px 10px; border-radius: 999px; font-weight: bold;
    }
    .head-updated { font-size: 12px; color: #6b6356; }
    button.reload {
      background: #322d24; color: #fff; border: none; border-radius: 999px;
      padding: 9px 16px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    button.reload:active { opacity: 0.8; }

    /* 統計タイル */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px; margin-bottom: 16px;
    }
    .stat-tile {
      background: #fffdf9; border-radius: 14px; padding: 12px 14px;
      border-top: 4px solid var(--accent, #cbb);
      box-shadow: 0 1px 6px rgba(60,50,20,0.05);
      cursor: pointer;
    }
    .stat-tile:active { transform: scale(0.98); }
    .stat-tile .stat-label { font-size: 13px; color: #6b6356; margin-bottom: 2px; }
    .stat-tile .stat-num { font-size: 27px; font-weight: bold; }
    .stat-tile .stat-sub { font-size: 12px; color: #857b69; margin-top: 2px; }
    .stat-shoots { --accent: #4f8ff7; }
    .stat-review { --accent: #f0a83c; }
    .stat-todo   { --accent: #2fb78c; }
    .stat-waiting{ --accent: #a58ee0; }

    /* セクション */
    section.card {
      background: #fffdf9; border-radius: 18px; padding: 16px 16px; margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(60,50,20,0.05);
    }
    section.card h2 {
      font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between;
    }
    h3.blocklabel {
      font-size: 13px; letter-spacing: 0.03em; color: #7a7057; font-weight: bold;
      margin: 14px 0 8px; display: flex; align-items: center; gap: 6px;
    }
    h3.blocklabel:first-of-type { margin-top: 4px; }
    .badge {
      display: inline-block; min-width: 20px; text-align: center;
      background: #eef0ea; color: #4c5145; border-radius: 999px;
      font-size: 12px; padding: 2px 9px; font-weight: bold;
    }
    .badge.warn { background: #fdecc8; color: #8a5a00; }
    .badge.accent { background: #dcecff; color: #1c4f91; }
    .badge.mint { background: #d9f3e7; color: #0f6a45; }
    .badge.violet { background: #ece4fb; color: #52389c; }

    ul.list { list-style: none; margin: 0; padding: 0; }
    .item-card {
      background: #fbf9f4; border-radius: 14px; padding: 12px 13px; margin-bottom: 8px;
      border: 1px solid #f0ece1;
    }
    .item-card:last-child { margin-bottom: 0; }
    .item-card.clickable { cursor: pointer; }
    .item-card.clickable:active { background: #f4efe2; }
    .row-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 15px; font-weight: bold; }
    .row-sub { font-size: 13px; color: #5c5548; margin-top: 4px; }
    .chip {
      display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
      background: #eef0ea; color: #4c5145; font-weight: bold; margin-right: 4px;
    }
    .chip.overdue { background: #fbdede; color: #a3271f; }
    .chip.warn { background: #fdecc8; color: #8a5a00; }
    .chip.ad { background: #e4e8fb; color: #33449c; }

    /* 撮影日からの経過日数バッジ(右上) */
    .days-badge {
      display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
      font-weight: bold; white-space: nowrap; flex-shrink: 0;
    }
    .days-badge.d-normal { background: #eef0ea; color: #4c5145; }
    .days-badge.d-amber { background: #fbe3ad; color: #7a4d00; }
    .days-badge.d-red { background: #f8c9c4; color: #8f2318; }

    .empty { color: #857b69; font-size: 14px; padding: 8px 4px; }

    details > summary {
      cursor: pointer; font-size: 16px; font-weight: bold; padding: 0; list-style: none;
      display: flex; align-items: center; justify-content: space-between;
    }
    details > summary::-webkit-details-marker { display: none; }
    .arrow::before { content: "▶ "; font-size: 12px; color: #857b69; }
    details[open] .arrow::before { content: "▼ "; }
    details .list { margin-top: 10px; }

    #detailView.hidden, #todayView.hidden { display: none; }
    .backbtn {
      background: none; border: none; color: #2f6fd6; font-size: 16px; padding: 4px 0 12px; font-weight: bold;
      cursor: pointer;
    }
    .detail-head h1 { font-size: 21px; margin: 0 0 4px; }
    .detail-head .meta { font-size: 14px; color: #5c5548; }
    .kv { font-size: 15px; margin: 7px 0; }
    .kv b { color: #4c453a; }
    h3.subhead { font-size: 14px; letter-spacing: 0.04em; color: #7a7057; margin: 20px 0 8px; text-transform: uppercase; }
    .order-item {
      background: #fbf9f4; border: 1px solid #f0ece1; border-radius: 12px; padding: 12px 13px; margin-bottom: 10px;
    }
    .order-item .order-title { font-size: 15px; font-weight: bold; }
    .order-item .status { font-size: 13px; color: #1c4f91; font-weight: bold; margin-top: 2px; }
    .links a {
      display: inline-block; margin-right: 10px; font-size: 14px; color: #2f6fd6; font-weight: bold;
    }
    .errbox {
      background: #fbdede; color: #8f231a; padding: 10px 14px; border-radius: 12px;
      margin-bottom: 12px; font-size: 14px; white-space: pre-wrap;
    }
    .okbox {
      background: #e4f5e8; color: #1f7a41; padding: 8px 14px; border-radius: 12px;
      margin-bottom: 12px; font-size: 14px;
    }
    .loading { text-align: center; color: #857b69; padding: 24px 0; font-size: 14px; }
    .footnote {
      font-size: 13px; color: #857b69; margin-top: 16px; padding: 10px 12px;
      background: #f3f0e7; border-radius: 12px;
    }

    /* W2: 状態変更ボタン・編集フォーム */
    .order-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .order-actions button {
      background: #2f6fd6; color: #fff; border: none; border-radius: 999px;
      padding: 8px 14px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .order-actions button.danger { background: #b3372f; }
    .order-actions button.neutral { background: #77705f; }
    .order-actions button:active { opacity: 0.85; }
    .order-edit {
      margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e3ddcd;
      display: flex; flex-direction: column; gap: 8px;
    }
    .order-edit label { font-size: 13px; color: #5c5548; display: block; margin-bottom: 2px; }
    .order-edit input, .order-edit textarea {
      width: 100%; font-size: 15px; padding: 7px 9px; border: 1px solid #ddd6c4;
      border-radius: 8px; font-family: inherit; background: #fff;
    }
    .order-edit textarea { min-height: 50px; resize: vertical; }
    .order-edit .save-row { display: flex; justify-content: flex-end; }
    .order-edit .save-row button {
      background: #2fb78c; color: #fff; border: none; border-radius: 999px;
      padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .order-edit .save-row button:active { opacity: 0.85; }

    /* W3: 要確認解消・セレクト確定・注文追加 */
    .review-resolve {
      margin-top: 12px; padding: 10px 12px; background: #fdf6e6; border-radius: 12px;
      border: 1px solid #f0e0ad;
    }
    .review-resolve .row-sub { color: #7a5a00; font-weight: bold; }
    .review-resolve .order-actions button { background: #8a5a00; }
    .review-resolve .order-actions button.invalid { background: #77705f; }

    .shoot-review-box {
      margin-bottom: 14px; padding: 12px 14px; background: #fdf6e6; border-radius: 14px;
      border: 1px solid #f0e0ad; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .shoot-review-box .msg { font-size: 15px; color: #7a5a00; font-weight: bold; }
    .shoot-review-box button {
      background: #8a5a00; color: #fff; border: none; border-radius: 999px;
      padding: 8px 14px; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .adult-select {
      margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e3ddcd;
    }
    .adult-select .row-sub { margin-bottom: 6px; }
    .adult-select .radio-row, .adult-select .check-row {
      display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; font-size: 15px;
    }
    .adult-select label { display: flex; align-items: center; gap: 5px; }
    .adult-select .save-row { display: flex; justify-content: flex-end; }
    .adult-select .save-row button {
      background: #52389c; color: #fff; border: none; border-radius: 999px;
      padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .add-order-box {
      margin-top: 14px; padding: 12px 13px; background: #fbf9f4; border: 1px dashed #ddd6c4;
      border-radius: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .add-order-box select {
      flex: 1; min-width: 160px; font-size: 15px; padding: 7px 9px; border: 1px solid #ddd6c4;
      border-radius: 8px; background: #fff; font-family: inherit;
    }
    .add-order-box button {
      background: #2f6fd6; color: #fff; border: none; border-radius: 999px;
      padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div id="errArea"></div>

    <header>
      <div>
        <div class="eyebrow">AI STUDIO MANAGER</div>
        <h1>📷 写真スタジオOS</h1>
        <div class="date" id="dateLine"></div>
      </div>
      <div class="head-right">
        <span class="pill-ok">更新済み</span>
        <span class="head-updated" id="genAt">読み込み中…</span>
        <div style="display:flex; gap:6px;">
          <button class="reload" id="morningBtn" onclick="doMorningUpdate()">🌅 朝の更新</button>
          <button class="reload" onclick="loadToday()">再読込</button>
        </div>
      </div>
    </header>

    <div id="todayView">
      <div id="loadingToday" class="loading">読み込み中…</div>

      <div class="stats" id="statsRow" style="display:none">
        <div class="stat-tile stat-shoots" onclick="scrollTo_('sec-shoots')">
          <div class="stat-label">今日の撮影</div>
          <div class="stat-num" id="stat-shoots">0</div>
          <div class="stat-sub">件</div>
        </div>
        <div class="stat-tile stat-review" onclick="scrollTo_('sec-review')">
          <div class="stat-label">要確認</div>
          <div class="stat-num" id="stat-review">0</div>
          <div class="stat-sub">人の確認が必要</div>
        </div>
        <div class="stat-tile stat-todo" onclick="scrollTo_('sec-todo')">
          <div class="stat-label">やること</div>
          <div class="stat-num" id="stat-todo">0</div>
          <div class="stat-sub">今やる候補</div>
        </div>
        <div class="stat-tile stat-waiting" onclick="scrollTo_('sec-waiting')">
          <div class="stat-label">待ち</div>
          <div class="stat-num" id="stat-waiting">0</div>
          <div class="stat-sub">見なくてよい</div>
        </div>
      </div>

      <section class="card" id="sec-shoots" style="display:none">
        <h2>🎬 今日の撮影 <span class="badge accent" id="cnt-shoots">0</span></h2>
        <div id="list-shoots"></div>
      </section>

      <section class="card" id="sec-review" style="display:none">
        <h2>💛 要確認 <span class="badge warn" id="cnt-review">0</span></h2>
        <div id="list-review-other"></div>
        <h3 class="blocklabel">🎁 プリント・商品(外注)</h3>
        <ul class="list" id="list-review-goods"></ul>
        <h3 class="blocklabel">💾 データ(セレクト)</h3>
        <ul class="list" id="list-review-data"></ul>
      </section>

      <section class="card" id="sec-todo" style="display:none">
        <h2>✅ やること <span class="badge mint" id="cnt-todo">0</span></h2>
        <h3 class="blocklabel">🎁 プリント・商品(外注)</h3>
        <ul class="list" id="list-todo-goods"></ul>
        <h3 class="blocklabel">💾 データ(セレクト)</h3>
        <ul class="list" id="list-todo-data"></ul>
      </section>

      <section class="card" id="sec-waiting" style="display:none">
        <details>
          <summary><span class="arrow">待ち</span> <span class="badge violet" id="cnt-waiting">0</span></summary>
          <ul class="list" id="list-waiting"></ul>
        </details>
      </section>
    </div>

    <div id="detailView" class="hidden">
      <button class="backbtn" onclick="backToToday()">← 今日の画面へ戻る</button>
      <section class="card" id="detailBody"></section>
    </div>
  </main>

  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showError(msg) {
      document.getElementById('errArea').innerHTML =
        '<div class="errbox">エラー: ' + esc(msg) + '</div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function showOk(msg) {
      document.getElementById('errArea').innerHTML =
        '<div class="okbox">' + esc(msg) + '</div>';
      setTimeout(clearError, 2500);
    }
    function clearError() {
      document.getElementById('errArea').innerHTML = '';
    }
    function scrollTo_(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showToday() {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('todayView').classList.remove('hidden');
    }
    function showDetail() {
      document.getElementById('todayView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
    }
    function backToToday() {
      showToday();
      loadToday();
    }

    (function initDate() {
      const d = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('dateLine').textContent =
        d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + days[d.getDay()] + '）';
    })();

    // 撮影日からの経過日数バッジ。〜4日=通常 / 5〜7日=琥珀 / 8日以上=赤
    function daysBadgeHtml_(n) {
      if (n == null) return '';
      var cls = 'd-normal';
      if (n >= 8) cls = 'd-red'; else if (n >= 5) cls = 'd-amber';
      return '<span class="days-badge ' + cls + '">' + n + '日目</span>';
    }

    // 案件名の後ろに付ける撮影日「(5/4撮影)」
    function shootDateSuffix_(iso) {
      if (!iso) return '';
      const parts = iso.split('-');
      if (parts.length !== 3) return '';
      return '(' + Number(parts[1]) + '/' + Number(parts[2]) + '撮影)';
    }

    // W4: [朝の更新]ボタン。Calendarから再取得してToday_Shoots等を再生成する。
    function doMorningUpdate() {
      clearError();
      const btn = document.getElementById('morningBtn');
      if (btn) btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) btn.disabled = false;
          showOk('朝の更新が完了しました(カレンダー' + res.count + '件)。');
          loadToday();
        })
        .withFailureHandler(function (err) {
          if (btn) btn.disabled = false;
          showError('朝の更新でエラー: ' + (err.message || err) + '(前回の表示のままです)');
        })
        .morningUpdate();
    }

    function loadToday() {
      clearError();
      document.getElementById('loadingToday').style.display = 'block';
      document.getElementById('statsRow').style.display = 'none';
      google.script.run
        .withSuccessHandler(function (data) {
          try {
            renderToday(data);
          } catch (e) {
            document.getElementById('loadingToday').style.display = 'none';
            showError('画面の描画でエラーが発生しました: ' + (e && e.message ? e.message : e) +
              (e && e.stack ? ('\n' + e.stack) : ''));
          }
        })
        .withFailureHandler(function (err) { showError(err.message || err); document.getElementById('loadingToday').style.display = 'none'; })
        .getToday();
    }

    function renderToday(data) {
      document.getElementById('loadingToday').style.display = 'none';
      if (!data) {
        showError('サーバーから空の応答が返りました。ブラウザの拡張機能(広告ブロッカー等)が' +
          '通信を妨げている可能性があります。無効化して再読込してください。');
        return;
      }
      document.getElementById('genAt').textContent = '最終更新 ' + data.generatedAt;
      if (data.morningError) {
        showError('朝の更新でエラーが発生しています(前回の表示のままです): ' + data.morningError);
      }

      document.getElementById('stat-shoots').textContent = data.todayShoots.length;
      document.getElementById('stat-review').textContent = data.needsReview.length;
      document.getElementById('stat-todo').textContent = data.todo.length;
      document.getElementById('stat-waiting').textContent = data.waiting.length;
      document.getElementById('statsRow').style.display = 'grid';

      renderShoots(data.todayShoots);
      renderReview(data.needsReview);
      renderTodo(data.todo);
      renderWaiting(data.waiting);
    }

    function renderShoots(shoots) {
      const sec = document.getElementById('sec-shoots');
      const list = document.getElementById('list-shoots');
      document.getElementById('cnt-shoots').textContent = shoots.length;
      sec.style.display = 'block';
      if (!shoots.length) {
        list.innerHTML = '<div class="empty">本日・明日のカレンダー予定はありません(朝の更新が未実行の可能性もあります)</div>';
        return;
      }
      list.innerHTML = '<ul class="list">' + shoots.map(shootCardHtml_).join('') + '</ul>';
    }

    function shootCardHtml_(s) {
      const cls = 'item-card' + (s.matchShootId ? ' clickable' : '');
      const onclick = s.matchShootId ? ' onclick="openShoot(\'' + esc(s.matchShootId) + '\')"' : '';
      const title = (s.genre || s.lastName)
        ? (esc(s.genre) + ' ' + esc(s.lastName) + '様' + (s.people ? '(' + esc(s.people) + ')' : ''))
        : esc(s.title || '(タイトル読み取り不可)');
      const subParts = [];
      if (s.ageGender) subParts.push(esc(s.ageGender));
      if (s.memo) subParts.push(esc(s.memo));
      const sub = subParts.length ? '<div class="row-sub">' + subParts.join(' / ') + '</div>' : '';
      const matchLine = s.matchCustomerName
        ? '<div class="row-sub">候補: ' + esc(s.matchCustomerName) + '様' +
          (s.matchShootId ? ' → 過去の来店を見る' : '(過去の撮影記録なし)') + '</div>'
        : '';
      return '<li class="' + cls + '"' + onclick + '>' +
        '<div class="row-main"><span>' + esc(s.time) + ' ' + title + '</span></div>' +
        sub + matchLine + '</li>';
    }

    function reviewItemHtml_(it) {
      const cls = 'item-card' + (it.shootId ? ' clickable' : '');
      const click = it.shootId ? ' onclick="openShoot(\'' + esc(it.shootId) + '\')"' : '';
      const customerBtn = (it.kind === 'customer' && it.customerId)
        ? '<div class="order-actions" onclick="event.stopPropagation()">' +
          '<button class="neutral" onclick="doResolveCustomer(\'' + esc(it.customerId) + '\')">別家族として確認済み</button></div>'
        : '';
      return '<li class="' + cls + '"' + click + '>' +
        '<div class="row-main"><span>' + esc(it.label) + ' ' + shootDateSuffix_(it.shootDate) + '</span>' +
        daysBadgeHtml_(it.elapsedDays) + '</div>' +
        '<div class="row-sub"><span class="chip warn">' + labelKind_(it.kind) + '</span></div>' +
        customerBtn + '</li>';
    }
    function labelKind_(kind) {
      return kind === 'order' ? '注文' : (kind === 'customer' ? '顧客' : '撮影');
    }

    function renderReview(items) {
      document.getElementById('cnt-review').textContent = items.length;
      document.getElementById('sec-review').style.display = 'block';

      const other = items.filter(function (i) { return i.category === 'other'; });
      const goods = items.filter(function (i) { return i.category === 'goods'; });
      const data = items.filter(function (i) { return i.category === 'data'; });

      document.getElementById('list-review-other').innerHTML = other.length
        ? '<ul class="list">' + other.map(reviewItemHtml_).join('') + '</ul>' : '';
      document.getElementById('list-review-goods').innerHTML = goods.length
        ? '<ul class="list">' + goods.map(reviewItemHtml_).join('') + '</ul>' : '<div class="empty">なし</div>';
      document.getElementById('list-review-data').innerHTML = data.length
        ? '<ul class="list">' + data.map(reviewItemHtml_).join('') + '</ul>' : '<div class="empty">なし</div>';

      if (!items.length) {
        document.getElementById('list-review-goods').innerHTML = '<div class="empty">要確認はありません 🎉</div>';
        document.getElementById('list-review-data').innerHTML = '';
      }
    }

    function renderTodo(items) {
      document.getElementById('cnt-todo').textContent = items.length;
      document.getElementById('sec-todo').style.display = 'block';

      const goods = items.filter(function (i) { return i.category === 'goods'; });
      const data = items.filter(function (i) { return i.category === 'data'; });

      document.getElementById('list-todo-goods').innerHTML = goods.length
        ? goods.map(orderItemHtml_).join('') : '<div class="empty">なし</div>';
      document.getElementById('list-todo-data').innerHTML = data.length
        ? data.map(orderItemHtml_).join('') : '<div class="empty">なし</div>';

      if (!items.length) {
        document.getElementById('list-todo-goods').innerHTML = '<div class="empty">やることはありません 🎉</div>';
        document.getElementById('list-todo-data').innerHTML = '';
      }
    }

    function renderWaiting(items) {
      const sec = document.getElementById('sec-waiting');
      const list = document.getElementById('list-waiting');
      document.getElementById('cnt-waiting').textContent = items.length;
      sec.style.display = 'block';
      if (!items.length) {
        list.innerHTML = '<div class="empty">待ちはありません</div>';
        return;
      }
      list.innerHTML = items.map(orderItemHtml_).join('');
    }

    function orderItemHtml_(it) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const overdue = it.dueDate && it.dueDate < todayStr;
      const due = it.dueDate ? ('期限 ' + it.dueDate) : (it.finishDate ? ('仕上がり予定 ' + it.finishDate) : '期限なし');
      return '<li class="item-card clickable" onclick="openShoot(\'' + esc(it.shootId) + '\')">' +
        '<div class="row-main"><span>' + esc(it.orderType) + ' ' + esc(it.customerName) + '様 ' +
        shootDateSuffix_(it.shootDate) + '</span>' +
        daysBadgeHtml_(it.elapsedDays) + '</div>' +
        '<div class="row-sub"><span class="chip' + (overdue ? ' overdue' : '') + '">' + esc(it.status) + '</span> ' +
        esc(due) + (overdue ? ' ・期限超過' : '') + '</div></li>';
    }

    function openShoot(shootId) {
      if (!shootId) return;
      clearError();
      document.getElementById('detailBody').innerHTML = '<div class="loading">読み込み中…</div>';
      showDetail();
      google.script.run
        .withSuccessHandler(function (data) {
          try {
            renderDetail(data);
          } catch (e) {
            showError('画面の描画でエラーが発生しました: ' + (e && e.message ? e.message : e) +
              (e && e.stack ? ('\n' + e.stack) : ''));
            document.getElementById('detailBody').innerHTML = '';
          }
        })
        .withFailureHandler(function (err) {
          showError(err.message || err);
          document.getElementById('detailBody').innerHTML = '';
        })
        .getShootDetail(shootId);
    }

    function renderDetail(d) {
      if (!d) {
        showError('サーバーから空の応答が返りました。ブラウザの拡張機能(広告ブロッカー等)が' +
          '通信を妨げている可能性があります。無効化して再読込してください。');
        document.getElementById('detailBody').innerHTML = '';
        return;
      }
      window.currentShootId = d.shootId;
      const cust = d.customer;
      const members = d.targetMembers.map(function (m) {
        return esc(m.name) + (m.birth ? '(' + esc(m.birth) + ')' : '');
      }).join(' ') || 'なし';

      const past = d.pastShoots.length
        ? '<ul class="list">' + d.pastShoots.map(function (p) {
            return '<li class="item-card clickable" onclick="openShoot(\'' + esc(p.shootId) + '\')">' +
              '<div class="row-main"><span>' + esc(p.date) + ' ' + esc(p.genre) +
              (d.isBusiness ? ' <span class="chip ad">広告</span>' : '') +
              '</span><span class="row-sub">詳細 →</span></div></li>';
          }).join('') + '</ul>'
        : '<div class="empty">過去の来店はありません</div>';

      const orders = d.orders.length
        ? d.orders.map(orderDetailHtml_).join('')
        : '<div class="empty">注文はありません</div>';

      const links = (d.driveUrl ? '<a href="' + esc(d.driveUrl) + '" target="_blank">元データ</a>' : '') +
        (d.albumUrl ? '<a href="' + esc(d.albumUrl) + '" target="_blank">オンラインアルバム</a>' : '');

      const shootReviewBox = d.needsReview
        ? '<div class="shoot-review-box"><span class="msg">この撮影情報は要確認です</span>' +
          '<button onclick="doResolveShoot(\'' + esc(d.shootId) + '\')">この内容で確認済みにする</button></div>'
        : '';

      const addOrderBox = '<div class="add-order-box">' +
        '<select id="add-order-type">' +
        (d.orderTypeOptions || []).map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('') +
        '</select>' +
        '<button onclick="doAddOrder(\'' + esc(d.shootId) + '\')">+ 注文を追加</button></div>';

      document.getElementById('detailBody').innerHTML =
        '<div class="detail-head">' +
        '<h1>' + esc(cust ? cust.name : '(不明な顧客)') + '様' +
        (cust ? ' (' + esc(cust.customerId) + ')' : '') +
        (d.needsReview ? ' <span class="chip warn">要確認</span>' : '') +
        (d.isBusiness ? ' <span class="chip ad">広告</span>' : '') + '</h1>' +
        '<div class="meta">' + esc(d.genre) + ' ' + esc(d.date) + ' / HP掲載: ' + esc(d.hp) + '</div>' +
        '</div>' +
        shootReviewBox +
        '<div class="kv"><b>家族:</b> ' + members + '</div>' +
        (d.remarks ? '<div class="kv"><b>備考:</b> ' + esc(d.remarks) + '</div>' : '') +
        (links ? '<div class="kv links">' + links + '</div>' : '') +
        '<h3 class="subhead">過去の来店</h3>' + past +
        '<h3 class="subhead">注文一覧</h3>' + orders + addOrderBox +
        (cust ? '<div class="kv" style="margin-top:12px"><b>連絡先:</b> ' + esc(cust.contact || '(未登録)') +
          ' / <b>住所:</b> ' + esc(cust.addr || '(未登録)') + '</div>' : '') +
        '<div class="footnote">状態変更・要確認の解消・注文追加はすべてEvent_Logに記録されます。</div>';
    }

    function orderDetailHtml_(o) {
      const due = o.dueDate ? ('期限' + o.dueDate) : (o.finishDate ? ('仕上がり予定' + o.finishDate) : '');
      const nextButtons = (o.nextStatuses || []).map(function (s) {
        const label = o.status === '保留' ? ('元の状態(' + s + ')に戻す') : ('→ ' + s);
        const cls = s === '不要' ? 'danger' : (s === '保留' ? 'neutral' : '');
        return '<button class="' + cls + '" onclick="doUpdateStatus(\'' + esc(o.orderId) + '\',\'' + esc(s) + '\')">' + esc(label) + '</button>';
      }).join('');

      // W3: 要確認の「実状態を確定」(通常の遷移制限とは別扱いで、系統内の全statusから選べる)
      const reviewBlock = (o.status === '要確認' && (o.reviewOptions || []).length)
        ? '<div class="review-resolve">' +
          '<div class="row-sub">実際の状態を選んでください</div>' +
          '<div class="order-actions">' +
          o.reviewOptions.map(function (s) {
            return '<button onclick="doResolveOrder(\'' + esc(o.orderId) + '\',\'' + esc(s) + '\')">' + esc(s) + 'にする</button>';
          }).join('') +
          '<button class="invalid" onclick="doInvalidateOrder(\'' + esc(o.orderId) + '\')">この案件は無効(不要にする)</button>' +
          '</div></div>'
        : '';

      // W3: 成人セレクト確定(成人商品(セレクト前)のみ)
      const adultBlock = (o.orderType === '成人商品(セレクト前)')
        ? '<div class="adult-select">' +
          '<div class="row-sub">セレクト確定</div>' +
          '<div class="radio-row">' +
          ['白台紙', '雅', 'ローズ'].map(function (p) {
            return '<label><input type="radio" name="adult-product-' + esc(o.orderId) + '" value="' + esc(p) + '">' + esc(p) + '</label>';
          }).join('') +
          '</div>' +
          '<div class="check-row">' +
          ['全カット美肌補正', '全データ'].map(function (opt) {
            return '<label><input type="checkbox" class="adult-opt-' + esc(o.orderId) + '" value="' + esc(opt) + '">' + esc(opt) + '</label>';
          }).join('') +
          '</div>' +
          '<div class="save-row"><button onclick="doConfirmAdultSelect(\'' + esc(o.orderId) + '\')">セレクトを確定する</button></div>' +
          '</div>'
        : '';

      return '<div class="order-item" id="order-' + esc(o.orderId) + '">' +
        '<div class="order-title">' + esc(o.orderId) + ' ' + esc(o.orderType) + '</div>' +
        '<div class="status">[' + esc(o.status) + ']</div>' +
        (due ? '<div class="row-sub">' + esc(due) + '</div>' : '') +
        (o.owner ? '<div class="row-sub">担当: ' + esc(o.owner) + '</div>' : '') +
        (o.memo ? '<div class="row-sub">メモ: ' + esc(o.memo) + '</div>' : '') +
        (nextButtons ? '<div class="order-actions">' + nextButtons + '</div>' : '') +
        reviewBlock + adultBlock +
        '<div class="order-edit">' +
        '<div><label>担当</label><input type="text" id="f-owner-' + esc(o.orderId) + '" value="' + esc(o.owner) + '"></div>' +
        '<div><label>期限</label><input type="date" id="f-due-' + esc(o.orderId) + '" value="' + esc(o.dueDate) + '"></div>' +
        '<div><label>セレクト予定日</label><input type="date" id="f-select-' + esc(o.orderId) + '" value="' + esc(o.selectDate) + '"></div>' +
        '<div><label>メモ</label><textarea id="f-memo-' + esc(o.orderId) + '">' + esc(o.memo) + '</textarea></div>' +
        '<div class="save-row"><button onclick="doSaveFields(\'' + esc(o.orderId) + '\')">保存</button></div>' +
        '</div>' +
        '</div>';
    }

    function doUpdateStatus(orderId, to) {
      clearError();
      google.script.run
        .withSuccessHandler(function () {
          showOk(orderId + ' を「' + to + '」に更新しました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .updateStatus(orderId, to);
    }

    function doSaveFields(orderId) {
      clearError();
      const fields = {
        '担当': document.getElementById('f-owner-' + orderId).value,
        '期限': document.getElementById('f-due-' + orderId).value,
        'セレクト予定日': document.getElementById('f-select-' + orderId).value,
        'メモ': document.getElementById('f-memo-' + orderId).value
      };
      google.script.run
        .withSuccessHandler(function () {
          showOk(orderId + ' を更新しました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .updateOrderFields(orderId, fields);
    }

    function reopenCurrentShoot_() {
      if (window.currentShootId) openShoot(window.currentShootId);
    }

    // ===== W3: 要確認解消 =====

    function doResolveOrder(orderId, status) {
      clearError();
      google.script.run
        .withSuccessHandler(function () {
          showOk(orderId + ' を「' + status + '」で確定しました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .resolveReview('order', orderId, { status: status });
    }

    function doInvalidateOrder(orderId) {
      clearError();
      google.script.run
        .withSuccessHandler(function () {
          showOk(orderId + ' を無効(不要)にしました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .resolveReview('order', orderId, { invalid: true });
    }

    function doResolveShoot(shootId) {
      clearError();
      google.script.run
        .withSuccessHandler(function () {
          showOk('撮影情報を確認済みにしました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .resolveReview('shoot', shootId, {});
    }

    function doResolveCustomer(customerId) {
      clearError();
      google.script.run
        .withSuccessHandler(function () {
          showOk('顧客を別家族として確認済みにしました。');
          loadToday();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .resolveReview('customer', customerId, {});
    }

    // ===== W3: 成人セレクト確定 =====

    function doConfirmAdultSelect(orderId) {
      clearError();
      const radios = document.getElementsByName('adult-product-' + orderId);
      var product = '';
      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) product = radios[i].value;
      }
      if (!product) { showError('白台紙・雅・ローズのいずれかを選んでください。'); return; }

      const checks = document.querySelectorAll('.adult-opt-' + orderId);
      const options = [];
      checks.forEach(function (c) { if (c.checked) options.push(c.value); });

      google.script.run
        .withSuccessHandler(function () {
          showOk(orderId + ' のセレクトを確定しました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .confirmAdultSelect(orderId, product, options);
    }

    // ===== W3: 注文追加 =====

    function doAddOrder(shootId) {
      clearError();
      const type = document.getElementById('add-order-type').value;
      google.script.run
        .withSuccessHandler(function () {
          showOk('注文を追加しました。');
          reopenCurrentShoot_();
        })
        .withFailureHandler(function (err) { showError(err.message || err); })
        .addOrder(shootId, type);
    }

    loadToday();
  </script>
</body>
</html>
