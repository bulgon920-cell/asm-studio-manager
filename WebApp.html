<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 0 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f4f4f5; color: #1c1c1e; font-size: 15px;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #1c1c1e; color: #fff;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    header .title { font-weight: bold; font-size: 16px; }
    header .sub { font-size: 12px; color: #b0b0b5; }
    header button {
      background: #3a3a3c; color: #fff; border: none; border-radius: 8px;
      padding: 6px 10px; font-size: 13px;
    }
    main { padding: 12px; max-width: 640px; margin: 0 auto; }
    section.card {
      background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    section.card h2 {
      font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px;
    }
    .badge {
      display: inline-block; min-width: 18px; text-align: center;
      background: #e5e5ea; color: #48484a; border-radius: 10px;
      font-size: 12px; padding: 1px 7px; font-weight: bold;
    }
    .badge.warn { background: #fff1c2; color: #8a6100; }
    ul.list { list-style: none; margin: 0; padding: 0; }
    ul.list li {
      padding: 9px 4px; border-bottom: 1px solid #eee; display: flex;
      flex-direction: column; gap: 2px; cursor: default;
    }
    ul.list li:last-child { border-bottom: none; }
    ul.list li.clickable { cursor: pointer; }
    ul.list li.clickable:active { background: #f0f0f2; }
    .row-main { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .row-sub { font-size: 12px; color: #6e6e73; }
    .empty { color: #8e8e93; font-size: 13px; padding: 6px 4px; }
    details > summary {
      cursor: pointer; font-size: 14px; font-weight: bold; padding: 4px 0;
      list-style: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▶ "; }
    details[open] > summary::before { content: "▼ "; }
    #detailView { display: none; }
    #todayView.hidden, #detailView.hidden { display: none; }
    .backbtn {
      background: none; border: none; color: #007aff; font-size: 15px; padding: 4px 0 12px;
    }
    .detail-head h1 { font-size: 17px; margin: 0 0 4px; }
    .detail-head .meta { font-size: 13px; color: #6e6e73; }
    .kv { font-size: 13px; margin: 4px 0; }
    .kv b { color: #48484a; }
    .order-item {
      border: 1px solid #e5e5ea; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    }
    .order-item .status { font-size: 12px; color: #007aff; font-weight: bold; }
    .links a {
      display: inline-block; margin-right: 10px; font-size: 13px; color: #007aff;
    }
    .errbox {
      background: #ffe5e5; color: #a30000; padding: 10px 12px; border-radius: 8px;
      margin-bottom: 12px; font-size: 13px; white-space: pre-wrap;
    }
    .loading { text-align: center; color: #8e8e93; padding: 24px 0; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">AI Studio Manager</div>
      <div class="sub" id="genAt">読み込み中…</div>
    </div>
    <button id="reloadBtn" onclick="loadToday()">更新</button>
  </header>

  <main>
    <div id="errArea"></div>

    <div id="todayView">
      <div id="loadingToday" class="loading">読み込み中…</div>

      <section class="card" id="sec-shoots" style="display:none">
        <h2>今日の撮影 <span class="badge" id="cnt-shoots">0</span></h2>
        <div id="list-shoots"></div>
      </section>

      <section class="card" id="sec-review" style="display:none">
        <h2>要確認 <span class="badge warn" id="cnt-review">0</span></h2>
        <ul class="list" id="list-review"></ul>
      </section>

      <section class="card" id="sec-todo" style="display:none">
        <h2>やること <span class="badge" id="cnt-todo">0</span></h2>
        <ul class="list" id="list-todo"></ul>
      </section>

      <section class="card" id="sec-waiting" style="display:none">
        <details>
          <summary>待ち <span class="badge" id="cnt-waiting">0</span></summary>
          <ul class="list" id="list-waiting"></ul>
        </details>
      </section>
    </div>

    <div id="detailView">
      <button class="backbtn" onclick="showToday()">← 今日の画面へ戻る</button>
      <div id="detailBody"></div>
    </div>
  </main>

  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showError(msg) {
      document.getElementById('errArea').innerHTML =
        '<div class="errbox">エラー: ' + esc(msg) + '</div>';
    }
    function clearError() {
      document.getElementById('errArea').innerHTML = '';
    }

    function showToday() {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('todayView').classList.remove('hidden');
    }
    function showDetail() {
      document.getElementById('todayView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
    }

    function loadToday() {
      clearError();
      document.getElementById('loadingToday').style.display = 'block';
      google.script.run
        .withSuccessHandler(renderToday)
        .withFailureHandler(function (err) { showError(err.message || err); document.getElementById('loadingToday').style.display = 'none'; })
        .getToday();
    }

    function renderToday(data) {
      document.getElementById('loadingToday').style.display = 'none';
      document.getElementById('genAt').textContent = '取得: ' + data.generatedAt;

      renderShoots(data.todayShoots);
      renderReview(data.needsReview);
      renderTodo(data.todo);
      renderWaiting(data.waiting);
    }

    function renderShoots(shoots) {
      const sec = document.getElementById('sec-shoots');
      const list = document.getElementById('list-shoots');
      document.getElementById('cnt-shoots').textContent = shoots.length;
      sec.style.display = 'block';
      if (!shoots.length) {
        list.innerHTML = '<div class="empty">本日の撮影情報はまだ表示できません(カレンダー連携はW4で追加予定)</div>';
        return;
      }
      list.innerHTML = '<ul class="list">' + shoots.map(function (s) {
        const cls = s.shootId ? 'clickable' : '';
        const onclick = s.shootId ? ' onclick="openShoot(\'' + esc(s.shootId) + '\')"' : '';
        return '<li class="' + cls + '"' + onclick + '>' +
          '<div class="row-main"><span>' + esc(s.time) + ' ' + esc(s.genre) + ' ' + esc(s.customerName) + '様</span>' +
          (s.shootId ? '<span class="row-sub">→ 詳細</span>' : '') + '</div></li>';
      }).join('') + '</ul>';
    }

    function renderReview(items) {
      const sec = document.getElementById('sec-review');
      const list = document.getElementById('list-review');
      document.getElementById('cnt-review').textContent = items.length;
      sec.style.display = 'block';
      if (!items.length) {
        list.innerHTML = '<div class="empty">要確認はありません</div>';
        return;
      }
      list.innerHTML = items.map(function (it) {
        const cls = it.shootId ? 'clickable' : '';
        const click = it.shootId ? ' onclick="openShoot(\'' + esc(it.shootId) + '\')"' : '';
        return '<li class="' + cls + '"' + click + '>' +
          '<div class="row-main"><span>[' + labelKind_(it.kind) + '] ' + esc(it.label) + '</span></div></li>';
      }).join('');
    }
    function labelKind_(kind) {
      return kind === 'order' ? '注文' : (kind === 'customer' ? '顧客' : '撮影');
    }

    function renderTodo(items) {
      const sec = document.getElementById('sec-todo');
      const list = document.getElementById('list-todo');
      document.getElementById('cnt-todo').textContent = items.length;
      sec.style.display = 'block';
      if (!items.length) {
        list.innerHTML = '<div class="empty">やることはありません</div>';
        return;
      }
      list.innerHTML = items.map(orderItemHtml_).join('');
    }

    function renderWaiting(items) {
      const sec = document.getElementById('sec-waiting');
      const list = document.getElementById('list-waiting');
      document.getElementById('cnt-waiting').textContent = items.length;
      sec.style.display = 'block';
      if (!items.length) {
        list.innerHTML = '<div class="empty">待ちはありません</div>';
        return;
      }
      list.innerHTML = items.map(orderItemHtml_).join('');
    }

    function orderItemHtml_(it) {
      const due = it.dueDate ? ('期限' + it.dueDate) : (it.finishDate ? ('仕上がり予定' + it.finishDate) : '期限なし');
      return '<li class="clickable" onclick="openShoot(\'' + esc(it.shootId) + '\')">' +
        '<div class="row-main"><span>' + esc(it.orderType) + ' ' + esc(it.customerName) + '様</span>' +
        '<span class="row-sub">' + esc(it.status) + '</span></div>' +
        '<div class="row-sub">' + esc(due) + '</div></li>';
    }

    function openShoot(shootId) {
      if (!shootId) return;
      clearError();
      document.getElementById('detailBody').innerHTML = '<div class="loading">読み込み中…</div>';
      showDetail();
      google.script.run
        .withSuccessHandler(renderDetail)
        .withFailureHandler(function (err) {
          showError(err.message || err);
          document.getElementById('detailBody').innerHTML = '';
        })
        .getShootDetail(shootId);
    }

    function renderDetail(d) {
      const cust = d.customer;
      const members = d.targetMembers.map(function (m) {
        return esc(m.name) + (m.birth ? '(' + esc(m.birth) + ')' : '');
      }).join(' ') || 'なし';

      const past = d.pastShoots.length
        ? '<ul class="list">' + d.pastShoots.map(function (p) {
            return '<li class="clickable" onclick="openShoot(\'' + esc(p.shootId) + '\')">' +
              '<div class="row-main"><span>' + esc(p.date) + ' ' + esc(p.genre) + '</span><span class="row-sub">→ 詳細</span></div></li>';
          }).join('') + '</ul>'
        : '<div class="empty">過去の来店はありません</div>';

      const orders = d.orders.length
        ? d.orders.map(function (o) {
            const due = o.dueDate ? ('期限' + o.dueDate) : (o.finishDate ? ('仕上がり予定' + o.finishDate) : '');
            return '<div class="order-item">' +
              '<div>' + esc(o.orderId) + ' ' + esc(o.orderType) + '</div>' +
              '<div class="status">[' + esc(o.status) + ']</div>' +
              (due ? '<div class="row-sub">' + esc(due) + '</div>' : '') +
              (o.owner ? '<div class="row-sub">担当: ' + esc(o.owner) + '</div>' : '') +
              (o.memo ? '<div class="row-sub">メモ: ' + esc(o.memo) + '</div>' : '') +
              '</div>';
          }).join('')
        : '<div class="empty">注文はありません</div>';

      const links = (d.driveUrl ? '<a href="' + esc(d.driveUrl) + '" target="_blank">元データ</a>' : '') +
        (d.albumUrl ? '<a href="' + esc(d.albumUrl) + '" target="_blank">オンラインアルバム</a>' : '');

      document.getElementById('detailBody').innerHTML =
        '<div class="detail-head">' +
        '<h1>' + esc(cust ? cust.name : '(不明な顧客)') + '様' +
        (cust ? ' (' + esc(cust.customerId) + ')' : '') +
        (d.needsReview ? ' <span class="badge warn">要確認</span>' : '') + '</h1>' +
        '<div class="meta">' + esc(d.genre) + ' ' + esc(d.date) + ' / HP掲載: ' + esc(d.hp) + '</div>' +
        '</div>' +
        '<div class="kv"><b>家族:</b> ' + members + '</div>' +
        (d.remarks ? '<div class="kv"><b>備考:</b> ' + esc(d.remarks) + '</div>' : '') +
        (links ? '<div class="kv links">' + links + '</div>' : '') +
        '<h2 style="font-size:14px;margin:14px 0 6px">過去の来店</h2>' + past +
        '<h2 style="font-size:14px;margin:14px 0 6px">注文一覧</h2>' + orders +
        (cust ? '<div class="kv" style="margin-top:12px"><b>連絡先:</b> ' + esc(cust.contact || '(未登録)') +
          ' / <b>住所:</b> ' + esc(cust.addr || '(未登録)') + '</div>' : '') +
        '<div class="empty" style="margin-top:16px">この画面は閲覧のみです(状態変更・メモ保存はW2以降で追加予定)</div>';
    }

    loadToday();
  </script>
</body>
</html>
